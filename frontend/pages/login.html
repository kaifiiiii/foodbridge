<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | FoodBridge</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
</head>
<body>
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="brand">FoodBridge</a>
      <nav class="nav-links"><a href="register.html">Sign up</a></nav>
    </div>
  </header>
  
  <main class="container">
    <div class="card auth-card">
      <h1>Log in</h1>

      <div id="form-message" class="form-message" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email">
          <div class="field-error" id="email-error"></div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password">
          <div class="field-error" id="password-error"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>

      <p style="margin-top: 1rem;">New here? <a href="register.html">Create an account</a></p>
    </div>
  </main>
    <script src="../js/validation.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/login.js"></script>

  <script src="../js/ui.js"></script>
</body>
</html>
